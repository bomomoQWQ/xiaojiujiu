# 小九九 / 浪潮：本仓库只运行 Runtime sidecar。
#
# AstrBot 与插件由 AstrBot 自己安装、升级、配置；本仓库不 clone、不挂载、不修改 AstrBot。
# 在 AstrBot 插件管理里安装 astrbot_plugin_companion_runtime，再把 runtime_base_url 指向：
#   - AstrBot 与 Runtime 在同一 Docker 网络： http://runtime:8787
#   - AstrBot 运行在宿主机：              http://127.0.0.1:8787
#
# 快速开始：
#   cp config/runtime.example.toml config/runtime.toml
#   cp .env.example .env
#   # 编辑两个文件，然后：
#   docker compose up -d --build

name: xiaojiujiu-runtime

services:
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiaojiujiu-runtime:local
    restart: unless-stopped
    # Dockerfile 的 CMD 是 serve；CLI 会自动发现工作目录下 config/runtime.toml。
    environment:
      # 秘密只能从 .env / 宿主环境进入；RuntimeConfig 与 /health 都拿不到明文 key。
      CR_STORAGE__DSN: ${CR_STORAGE__DSN:?copy .env.example to .env and set CR_STORAGE__DSN}
      CR_SEMANTIC_API_KEY: ${CR_SEMANTIC_API_KEY:-}
      # schema / conversation_id /行为 / 提示词统一在 config/runtime.toml 里改。
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 挂整个目录：没复制 runtime.toml 时仍可用 env/defaults 启动，不会把缺失文件挂成目录。
      - ./config:/app/runtime/config:ro
      # 可选 JSONL 审计镜像与迁移/回放产物；权威状态在 PostgreSQL。
      - runtime-data:/data
    ports:
      # Runtime 没有面向公网的鉴权设计，只发布到本机。
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  runtime-data:
