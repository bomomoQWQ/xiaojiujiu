[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endogenous-companion-runtime"
version = "0.3.1"
description = "Endogenous proactive long-term companion Runtime sidecar: persistent emotion, memory, user model, candidate intents and motivational decision making."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "bomomoQWQ" }]
keywords = ["agent", "runtime", "companion", "sidecar", "emotion", "memory"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Standard library first. FastAPI/uvicorn are the only real runtime needs;
# httpx/pytest are for the test suite.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# Only needed when storage.dsn selects PostgreSQL. SQLite is the default and needs
# nothing beyond the standard library, so psycopg stays an optional extra.
postgres = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
companion-runtime = "companion_runtime.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: slower end-to-end tests that exercise the full runtime loop",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
