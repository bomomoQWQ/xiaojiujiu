[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "endogenous-companion-runtime"
version = "0.3.2"
description = "Endogenous proactive long-term companion Runtime sidecar: persistent emotion, memory, user model, candidate intents and motivational decision making."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "bomomoQWQ" }]
keywords = ["agent", "runtime", "companion", "sidecar", "emotion", "memory"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# v2 is PostgreSQL-only and fits its MAP/Laplace user models with a small,
# deterministic numerical stack.  These are runtime requirements rather than optional
# extras: starting without PostgreSQL or silently falling back to SQLite would violate the
# v2 storage contract, and hand-written optimisers/linear algebra are deliberately avoided.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
companion-runtime = "companion_runtime.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: slower end-to-end tests that exercise the full runtime loop",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
